[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ensqsqed"
version = "0.1.0"
description = "A terminal browser for the Ensoniq SQ-R Plus"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
dependencies = ["textual>=0.40", "python-rtmidi>=1.4"]

[project.scripts]
ensqsqed = "ensqsqed.app:main"
sqcli = "ensqsqed.cli:main"

[tool.setuptools.packages.find]
include = ["sq*", "ensqsqed*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
